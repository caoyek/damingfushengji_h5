<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大明浮生记 H5</title>
    <link rel="stylesheet" href="styles.css?v=20260513-kfdb-sweep" />
    <script src="data/pages-data.js?v=20260510-offline-flow"></script>
    <script src="data/offline-flows.js?v=20260510-playable"></script>
    <script src="data/page-actions.js?v=20260510-links"></script>
    <script src="data/runtime-seed.js?v=20260513-kfdb-sweep"></script>
    <script src="data/reviewed-master-data.js?v=20260611-reviewed"></script>
    <script src="runtime-state.js?v=20260511-phase1"></script>
    <script src="backend-adapter.js?v=20260513-backend"></script>
    <script src="reviewed-runtime-resolver.js?v=20260612-reviewed-dungeon"></script>
    <script src="shared/tw-ui-renderer.js?v=20260510-offline-flow" defer></script>
    <script src="renderer.js?v=20260612-h5" defer></script>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="title">大明浮生记 H5</div>
        <div class="flow-panel">
          <div class="flow-title">Offline Flow</div>
          <select id="flow-select" class="flow-select"></select>
          <div class="flow-buttons">
            <button id="flow-prev" type="button">上一步</button>
            <button id="flow-next" type="button">下一步</button>
          </div>
          <div id="flow-meta" class="flow-meta"></div>
          <div id="quick-pages" class="quick-pages"></div>
        </div>
        <div class="evidence-panel">
          <div class="flow-title">APK Evidence</div>
          <div id="flow-evidence" class="flow-evidence"></div>
        </div>
        <div class="action-panel">
          <div class="flow-title">Deterministic Clicks</div>
          <label class="action-toggle">
            <input id="show-actions" type="checkbox" checked />
            show APK-proven hotspots
          </label>
          <div id="page-actions" class="page-actions"></div>
        </div>
        <input id="page-filter" class="filter" type="search" placeholder="Filter XML" />
        <select id="page-select" class="page-select" size="22"></select>
        <div id="page-meta" class="meta"></div>
      </aside>
      <section class="viewport">
        <div id="stage" class="stage"></div>
        <div id="stage-flow-controls" class="stage-flow-controls" hidden>
          <button id="stage-flow-prev" type="button">上一步</button>
          <button id="stage-flow-next" type="button">下一步</button>
          <span id="stage-flow-label"></span>
        </div>
      </section>
    </main>
  </body>
</html>
